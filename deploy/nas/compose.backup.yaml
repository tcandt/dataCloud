services:
  backup:
    image: ghcr.io/tcandt/datacloud-backup:${APP_TAG:-0.1.7}
    profiles:
      - backup
    restart: unless-stopped
    init: true
    user: 999:999
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=2g,nosuid,nodev,mode=1777
    environment:
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_PGHOST: postgres
      BACKUP_PGSSLMODE: verify-full
      BACKUP_PGSSLROOTCERT: /run/tls/ca.pem
      BACKUP_SECRETS_DIRECTORY: /recovery/current/secrets
      BACKUP_CONFIG_DIRECTORY: /recovery/current/config
    volumes:
      - control_plane_backups:/backups
      - ./backup-inputs:/recovery:ro
      - ./backup-key:/run/backup-key:ro
      - public_ca:/run/tls:ro
    networks:
      - database
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - /opt/datacloud/backup.pyc
        - health
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20m
    mem_limit: 3g
    cpus: ${BACKUP_CPUS:-1}
volumes:
  control_plane_backups: null
