name: Validate public Docker deployment
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with: { node-version: 24 }
      - name: Validate deployment with synthetic local settings
        run: |
          node --input-type=module -e 'import { configureNas } from "./scripts/nas-configure.mjs"; await configureNas("deploy/nas", { origin:"https://localhost:8443", email:"owner@example.invalid", password:"Synthetic-validation-password-123", name:"Test", organizationName:"Test", mongoDataDirectory:"./data", existingMongo:false, tunnelToken:"" });'
          docker compose -f deploy/nas/compose.yaml --profile tunnel config --quiet
          docker compose -f deploy/nas/compose.yaml -f deploy/nas/compose.mongo-port.yaml config --quiet
          test ! -d apps
          test ! -d services
          test ! -f package-lock.json
